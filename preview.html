<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; worker-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; navigate-to 'none'">
  <title>Bard AI Vorschau</title>
</head>
<body>
  <p>Vorschau wird vorbereitet …</p>
  <script>
    addEventListener('message', event => {
      const data = event.data;
      if (event.source !== parent || !data || data.type !== 'bard-preview' || typeof data.html !== 'string' || data.html.length > 100000) return;
      document.open();
      document.write(data.html);
      document.close();
    }, { once: true });
  </script>
</body>
</html>
