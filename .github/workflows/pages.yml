name: Deploy Bard AI PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.css'
      - 'app.js'
      - 'pcm-capture.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'worker/src/**'
      - 'worker/test/**'
      - 'worker/package.json'
      - 'icons/bard.svg'
      - 'icons/bard-512.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PWA
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check Worker source and tests
        run: |
          node --check worker/src/index.js
          npm --prefix worker test
      - name: Stage static app files
        run: |
          mkdir -p _site/icons
          cp index.html app.css app.js pcm-capture.js manifest.webmanifest sw.js _site/
          cp icons/bard.svg icons/bard-512.png _site/icons/
          cp index.html _site/404.html
          sed -i 's|<head>|<head><base href="/Bard-AI/">|' _site/404.html
          test -s _site/index.html
          test -s _site/pcm-capture.js
          test -s _site/404.html
          touch _site/.nojekyll
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
